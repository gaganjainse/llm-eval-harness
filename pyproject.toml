[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-eval-harness"
version = "1.0.0"
description = "Golden-set LLM evaluation harness with LLM-as-judge and offline fallbacks"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6.0.3", "httpx>=0.27"]

[tool.setuptools.packages.find]
include = ["eval_harness*"]
